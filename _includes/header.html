<!-- 사이트 상단: 터미널 경로식 로고와 메뉴 -->
<header class="site-header" role="banner">
  <div class="wrapper">
    <a class="site-title" rel="author" href="{{ "/" | relative_url }}"><span class="prompt">~/</span>{{ site.title | escape }}</a>
    <nav class="site-nav">
      {%- for path in site.header_pages -%}
        {%- assign my_page = site.pages | where: "path", path | first -%}
        {%- if my_page.title -%}
        <a href="{{ my_page.url | relative_url }}">{{ my_page.title | escape }}</a>
        {%- endif -%}
      {%- endfor -%}
      <a href="https://dev.to/leejunhwa88">dev.to (EN)</a>
    </nav>
  </div>
</header>
